<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KORA Pilates</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  margin:0; padding:0;
  background:#f7f4ef; color:#333;
  font-family:"Garamond", serif;
  overflow-x:hidden;
}
.fade { opacity:0; transform:translateY(40px); transition:all 1.4s ease; }
.fade.show { opacity:1; transform:translateY(0); }

.hero {
  height:90vh;
  background:url('https://source.unsplash.com/1600x900/?yoga,studio') center/cover;
  display:flex; align-items:center; justify-content:center;
  position:relative;
}
.hero::after {
  content:""; position:absolute; inset:0;
  background:rgba(255,255,255,0.55);
}
.hero h1 {
  position:relative;
  font-size:52px;
  padding:20px 40px;
  background:rgba(255,255,255,0.8);
  border-radius:20px;
}

.section {
  max-width:1100px; margin:120px auto; padding:0 20px;
}
.card {
  background:#ffffff;
  border-radius:20px;
  padding:30px;
  box-shadow:0 20px 40px rgba(0,0,0,0.08);
  margin-bottom:40px;
  transition:transform 0.8s ease, box-shadow 0.8s ease;
}
.card:hover {
  transform:translateY(-16px);
  box-shadow:0 30px 60px rgba(0,0,0,0.12);
}
.card img {
  width:100%; border-radius:16px; margin-bottom:20px;
}
.card h2 {
  font-size:30px; margin-bottom:10px;
}
.card p {
  font-size:18px; color:#555;
}

.back {
  display:block; text-align:center; margin:80px auto;
  color:#6b705c; font-size:16px; text-decoration:none;
}
</style>
</head>
<body>

<div class="hero fade">
  <h1>KORA Pilates Studio</h1>
</div>

<div class="section fade">
  <div class="card">
    <img src="https://source.unsplash.com/1600x900/?pilates,studio">
    <h2>Reformer Pilates</h2>
    <p>Präzise Bewegung, tiefe Kontrolle, bewusste Ausrichtung.</p>
  </div>

  <div class="card">
    <img src="https://source.unsplash.com/1600x900/?pilates,mat">
    <h2>Mat Pilates</h2>
    <p>Stabilität, Balance, Eleganz – klassisches Pilates neu gedacht.</p>
  </div>

  <div class="card">
    <img src="https://source.unsplash.com/1600x900/?meditation,yoga">
    <h2>Yoga Flow</h2>
    <p>Fließende Sequenzen, Atem als Rhythmus, Körper als Raum.</p>
  </div>
</div>

<a class="back" href="../portfolio.html">← Zurück zum Portfolio</a>

<script>
window.addEventListener("load", () => {
  document.querySelectorAll(".fade").forEach(el => el.classList.add("show"));
});
</script>

</body>
</html>
