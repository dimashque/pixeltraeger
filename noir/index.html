<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>NOIR Architektur</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  margin:0; padding:0;
  background:#050505; color:#eaeaea;
  font-family:"Inter", sans-serif;
  overflow-x:hidden;
}
.fade { opacity:0; transform:translateY(40px); transition:all 1.4s ease; }
.fade.show { opacity:1; transform:translateY(0); }

.hero {
  height:100vh;
  background:url('https://source.unsplash.com/1600x900/?architecture,minimal') center/cover fixed;
  display:flex; align-items:center; justify-content:center;
  position:relative;
}
.hero::after {
  content:""; position:absolute; inset:0;
  background:rgba(0,0,0,0.65);
}
.hero h1 {
  position:relative;
  font-size:64px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  font-weight:700;
  padding:20px 40px;
  border:1px solid rgba(255,255,255,0.3);
}

.section {
  max-width:1200px; margin:120px auto; padding:0 20px;
}
.project {
  margin-bottom:120px;
}
.project img {
  width:100%; border-radius:0;
  filter:grayscale(100%) contrast(130%);
  transition:filter 1s ease, transform 1s ease;
}
.project:hover img {
  filter:grayscale(0%) contrast(100%);
  transform:scale(1.03);
}
.project h2 {
  font-size:36px; margin-top:24px;
  text-transform:uppercase;
  letter-spacing:0.08em;
}
.project p {
  max-width:700px;
  color:#bdbdbd;
  font-size:18px;
  line-height:1.7;
}

.back {
  display:block; text-align:center; margin:80px auto;
  color:#7cf5ff; font-size:16px; text-decoration:none;
}
</style>
</head>
<body>

<div class="hero fade">
  <h1>NOIR Architektur</h1>
</div>

<div class="section fade">
  <div class="project">
    <img src="https://source.unsplash.com/1600x900/?architecture,concrete">
    <h2>Villa am Wannsee</h2>
    <p>Beton, Glas, Schatten. Eine radikal klare Wohnskulptur am Wasser.</p>
  </div>

  <div class="project">
    <img src="https://source.unsplash.com/1600x900/?building,minimal">
    <h2>Gewerbehof Altona</h2>
    <p>Industrielle Geometrie, modulare Struktur, urbane Identität.</p>
  </div>

  <div class="project">
    <img src="https://source.unsplash.com/1600x900/?architecture,modern">
    <h2>Haus E36</h2>
    <p>Strenge Linien, offene Räume, Licht als Material.</p>
  </div>
</div>

<a class="back" href="../portfolio.html">← Zurück zum Portfolio</a>

<script>
window.addEventListener("load", () => {
  document.querySelectorAll(".fade").forEach(el => el.classList.add("show"));
});
</script>

</body>
</html>
